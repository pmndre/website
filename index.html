<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pmnd.re</title>
<style>
	:root { color-scheme: light dark; --bg: #f3f4f1; --text: #1a1d1b; --muted: #666e68; --brand: #1f7a55; }
	@media (prefers-color-scheme: dark) { :root { --bg: #1b1e28; --text: #e4f0fb; --muted: #a6accd; --brand: #5de4c7; } }
	html, body { height: 100%; margin: 0; }
	body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
	main { text-align: center; padding: 24px; }
	h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
	p { margin: 0; color: var(--muted); }
	a { color: var(--brand); }
</style>
</head>
<body>
<main>
	<h1>Hello, world.</h1>
	<p>This is where pmnd.re will be. Meanwhile: <a href="https://pine.pmnd.re">pine.pmnd.re</a></p>
</main>
</body>
</html>
